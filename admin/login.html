<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="admin-mode">

  <!-- Tombol kembali ke halaman utama -->
  <div class="top-right-toggle">
    <a href="index.html" class="back-btn" title="Kembali ke halaman utama">
      <i class="fa-solid fa-arrow-left"></i>
      <span>KEMBALI</span>
    </a>
  </div>

  <!-- Card utama -->
  <div class="login-wrapper">

    <div class="mode-badge admin">ADMIN LOGIN</div>

    <!-- Panel kiri -->
    <div class="left-panel">
      <div class="logo">
        <div class="logo-icon"></div>
        <div class="logo-text">Sabana<br>Fried Chicken</div>
      </div>

      <div class="avatar">
        <i class="fa-solid fa-user-shield"></i>
      </div>

      <div class="form-title">ADMIN LOGIN</div>

      <div class="alert" id="alertBox"></div>

      <!-- ============ FORM LOGIN ADMIN ============ -->
      <form id="loginForm" action="process/login.php" method="POST" onsubmit="return handleLogin(event)">
        <input type="hidden" name="role" value="admin">

        <div class="input-group">
          <i class="fa-solid fa-envelope left-icon"></i>
          <input type="email" name="email" id="loginEmail" placeholder="EMAIL" required>
        </div>

        <div class="input-group">
          <i class="fa-solid fa-lock left-icon"></i>
          <input type="password" name="password" id="loginPassword" placeholder="PASSWORD" required>
        </div>

        <button type="submit" class="login-btn">LOGIN</button>

        <div class="form-footer">
          <label class="remember">
            <input type="checkbox" name="remember"> Remember me
          </label>
          <a href="#">Forgot your password?</a>
        </div>
      </form>

    </div>

    <!-- Panel kanan -->
    <div class="right-panel">
      <div class="welcome-content">
        <h1>Admin Panel.</h1>
        <p>Halaman khusus administrator. Masuk dengan kredensial admin Anda untuk mengelola sistem.</p>
      </div>
    </div>

  </div>

<script src="js/script-admin.js"></script>
</body>
</html>
